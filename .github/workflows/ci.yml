name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.25.1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Audit admin route guards
        run: npm run audit:admin

      - name: Audit tracked auth routes
        run: npm run audit:tracked

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-local-secret-that-is-long-enough-2026
          ADMIN_EMAILS: admin-e2e@example.test
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""

      - name: Secret scan
        run: npm run secrets:scan

      - name: E2E tests
        run: npm run test:e2e
